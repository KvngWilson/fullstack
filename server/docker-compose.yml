# Server-specific Docker Compose for local development
# Use this when developing server in isolation from the main application
#
# NOTE: For full-stack development, use docker-compose.yml in the root directory

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-db-dev
    labels:
      environment: "development"
      service: "database"
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/queries.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./data/migrations:/docker-entrypoint-initdb.d/03-migrations:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - server-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis-dev
    labels:
      environment: "development"
      service: "cache"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_1234567890}
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - server-network

  mailhog:
    image: tophfr/mailhog:latest
    container_name: ecommerce-mailhog-dev
    labels:
      environment: "development"
      service: "mailhog"
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped
    networks:
      - server-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: ecommerce-api-dev
    labels:
      environment: "development"
      service: "api"
    environment:
      NODE_ENV: development
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_1234567890}

      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      JWT_EXPIRES_IN: 7d
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production}

      APP_URL: ${APP_URL:-http://localhost:5000}
      LOG_LEVEL: debug
    command: npm run dev
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./src:/app/src
      - ./api:/app/api
      - ./config:/app/config
      - ./domain:/app/domain
      - ./services:/app/services
      - ./shared:/app/shared
      - ./views:/app/views
      - ./data:/app/data
      - ./infrastructure:/app/infrastructure
      - ./public:/app/public
      - ./swagger.yml:/app/swagger.yml
    restart: unless-stopped
    networks:
      - server-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5000/health/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  server-network:
    driver: bridge

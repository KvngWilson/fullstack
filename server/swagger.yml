      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingCreateRequest"
      responses:
        "201":
          description: "Onboarding created successfully"
        "403":
          description: "Forbidden"

  /api/v1/identity/onboarding/{id}:
    get:
      operationId: getOnboarding
      summary: "Get onboarding details"
      description: "Retrieve an onboarding plan and its task list"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Onboarding retrieved successfully"
        "404":
          description: "Onboarding not found"
    put:
      operationId: updateOnboarding
      summary: "Update onboarding"
      description: "Update onboarding details such as notes or budget"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingUpdateRequest"
      responses:
        "200":
          description: "Onboarding updated successfully"
        "403":
          description: "Forbidden"

  /api/v1/identity/onboarding/{id}/status:
    get:
      operationId: getOnboardingStatus
      summary: "Get onboarding status"
      description: "Retrieve completion percentage and task counts for an onboarding plan"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Onboarding status retrieved"
        "404":
          description: "Onboarding not found"

  /api/v1/identity/onboarding/{id}/start:
    put:
      operationId: startOnboarding
      summary: "Start onboarding"
      description: "Transition an onboarding plan from not_started to in_progress"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Onboarding started"
        "403":
          description: "Forbidden"

  /api/v1/identity/onboarding/{id}/complete:
    put:
      operationId: completeOnboarding
      summary: "Complete onboarding"
      description: "Transition an onboarding plan from in_progress to completed"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Onboarding completed"
        "403":
          description: "Forbidden"

  /api/v1/identity/onboarding/{id}/tasks:
    post:
      operationId: addOnboardingTask
      summary: "Add onboarding task"
      description: "Add a task to an onboarding plan"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingTaskCreateRequest"
      responses:
        "201":
          description: "Task added successfully"
        "403":
          description: "Forbidden"

  /api/v1/identity/onboarding/{id}/tasks/{taskId}/complete:
    put:
      operationId: completeOnboardingTask
      summary: "Complete onboarding task"
      description: "Mark an onboarding task as completed"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Task completed successfully"
        "403":
          description: "Forbidden"

  /api/v1/identity/onboarding/{id}/budget-override:
    post:
      operationId: applyOnboardingBudgetOverride
      summary: "Apply onboarding budget override"
      description: "Apply an HR-authorized budget override for an onboarding plan"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingBudgetOverrideRequest"
      responses:
        "200":
          description: "Budget override applied"
        "403":
          description: "Forbidden"

  /api/v1/catalog/products:
    get:
      operationId: listProducts
      summary: "Get all products"
      description: "Retrieve all products with pagination"
      tags: ["Catalog"]
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "A list of products"
    post:
      operationId: createProduct
      summary: "Create a new product"
      description: "Create a new product (admin only). Supports JSON or multipart form-data with optional image file field `image`."
      tags: ["Catalog"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProductCreateMultipartRequest"
      responses:
        "201":
          description: "Product created successfully"
        "403":
          description: "Admin access required"

  /api/v1/catalog/products/{productId}:
    get:
      operationId: getProductById
      summary: "Get a product by ID"
      description: "Retrieve a specific product"
      tags: ["Catalog"]
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Product found"
        "404":
          description: "Product not found"
    put:
      operationId: replaceProduct
      summary: "Replace a product"
      description: "Replace mutable fields of a product (admin only). Supports JSON or multipart form-data with optional image file field `image`."
      tags: ["Catalog"]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"

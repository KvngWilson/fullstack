        "404":
          description: "Invitation not found or expired"
    post:
      security: []
      operationId: acceptEmployeeInvitation
      summary: "Accept employee invitation"
      description: "Accept an employee invitation and create the employee account"
      tags: ["Identity"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInvitationAcceptanceRequest"
      responses:
        "201":
          description: "Invitation accepted successfully"
        "400":
          description: "Invalid invitation payload"

  /api/v1/identity/employees/invite:
    post:
      operationId: inviteEmployeeFromIdentity
      summary: "Invite employee"
      description: "Send an employee invitation from the identity domain"
      tags: ["Identity"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityEmployeeInviteRequest"
      responses:
        "201":
          description: "Invitation created successfully"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees/invitations:
    get:
      operationId: listEmployeeInvitations
      summary: "List pending employee invitations"
      description: "Retrieve pending invitations for employees"
      tags: ["Identity"]
      responses:
        "200":
          description: "Pending invitations retrieved"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees/resend-invitation/{id}:
    post:
      operationId: resendEmployeeInvitation
      summary: "Resend employee invitation"
      description: "Resend a pending employee invitation email"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Invitation resent"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees:
    get:
      operationId: listIdentityEmployees
      summary: "List employees"
      description: "Retrieve employees via the identity employee-management surface"
      tags: ["Identity"]
      responses:
        "200":
          description: "Employees retrieved successfully"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees/{id}:
    get:
      operationId: getIdentityEmployee
      summary: "Get employee details"
      description: "Retrieve an employee record from the identity domain"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Employee retrieved successfully"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees/{id}/role:
    patch:
      operationId: updateIdentityEmployeeRole
      summary: "Update employee role"
      description: "Update an employee's assigned role"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityEmployeeRoleUpdateRequest"
      responses:
        "200":
          description: "Employee role updated"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees/{id}/status:
    patch:
      operationId: updateIdentityEmployeeStatus
      summary: "Update employee status"
      description: "Update an employee's employment status"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityEmployeeStatusUpdateRequest"
      responses:
        "200":
          description: "Employee status updated"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees/{id}/permissions/override:
    post:
      operationId: setEmployeePermissionOverride
      summary: "Set employee permission override"
      description: "Grant or revoke employee-specific permission overrides"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePermissionOverrideRequest"
      responses:
        "200":
          description: "Permission override updated"
        "403":
          description: "Forbidden"

  /api/v1/identity/employees/{id}/audit-log:
    get:
      operationId: getEmployeeAuditLog
      summary: "Get employee audit log"
      description: "Retrieve audit events associated with an employee"
      tags: ["Identity"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Field to sort by
      schema:
        type: string
        example: created_at
    Order:
      name: order
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: "securePassword123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "securePassword123"
      example:
        email: "demo@example.com"
        password: "hunter2!!"

    UserCreateRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 6
          maxLength: 100
          example: "securePassword123"
        first_name:
          type: string
          example: "Ada"
        last_name:
          type: string
          example: "Lovelace"
        role:
          type: string
          enum: [customer, admin, vendor]
          default: customer
          example: "customer"
      example:
        email: "new.user@example.com"
        password: "StrongPass!234"
        first_name: "Ada"
        last_name: "Lovelace"

    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 100
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [customer, admin, vendor]

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        first_name:
          type: string
          example: "Ada"
        last_name:
          type: string
          example: "Lovelace"
        role:
          type: string
          enum: [customer, admin, vendor]
          example: "customer"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
        token:
          type: string
          description: "JWT authentication token (only returned on register/login)"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ProductRequest:
      type: object
      required:
        - name
        - brand
        - base_price
      properties:
        name:
          type: string
          example: "Silk Chiffon Gown"
        description:
          type: string
          example: "Hand-beaded evening dress"
        brand:
          type: string
          example: "Elie Saab"
        material:
          type: string
          example: "100% silk chiffon"
        care_instructions:
          type: string
          example: "Dry clean only"
        base_price:
          type: number
          format: double
          example: 2895.00
        is_active:
          type: boolean
          default: true
      example:
        name: "Silk Chiffon Gown"
        description: "Hand-beaded evening dress"
        brand: "Elie Saab"
        material: "100% silk chiffon"
        care_instructions: "Dry clean only"
        base_price: 2895.00
        is_active: true

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: "Silk Chiffon Gown"
        description:
          type: string
        brand:
          type: string
        material:
          type: string
        care_instructions:
          type: string
        base_price:
          type: number
          format: double
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 1
        pageSize:
          type: integer
          format: int32
          example: 20
        total:
          type: integer
          format: int32
          example: 100
        hasNext:
          type: boolean
          example: true

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid product ID supplied"
        message:
          type: string
          example: "Email and password required."
      example:
        error: "Product not found"

    AddToCartRequest:
      type: object
      required:
        - variant_id
        - quantity
      properties:
        variant_id:
          type: integer
          format: int32
          example: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2

    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 3

    CartItemResponse:
      type: object
      properties:
        cart_item_id:
          type: integer
          format: int32
        cart_id:
          type: integer
          format: int32
        variant_id:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        added_at:
          type: string
          format: date-time

    CartItemDetail:
      type: object
      properties:
        cart_item_id:
          type: integer
          format: int32
        variant_id:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        added_at:
          type: string
          format: date-time
        sku:
          type: string
          example: "SKU-12345"
        size:
          type: string
          example: "M"
        color:
          type: string
          example: "Blue"
        price_adjustment:
          type: number
          format: double
          example: 0.00
        product_id:
          type: integer
          format: int32
        name:
          type: string
          example: "Silk Chiffon Gown"
        base_price:
          type: number
          format: double
          example: 2895.00
        brand:
          type: string
          example: "Elie Saab"

    CartResponse:
      type: object
      properties:
        cart_id:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemDetail"

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        user_id:
          type: integer
          format: int32
        net_amount:
          type: number
          format: double
        tax:
          type: number
          format: double
        shipping_cost:
          type: number
          format: double
        total_amount:
          type: number
          format: double
        status:
          type: string

openapi: "3.0.0"
info:
  title: "E-Commerce Platform API"
  version: "1.0.0"
  description: |
    # E-Commerce REST API Documentation

    Current REST API surface for the ecommerce platform.

    ## API Overview
    - **Base URL**: `/api/v1`
    - **Authentication**: httpOnly cookies and JWT bearer support
    - **Session Model**: Primary auth uses httpOnly cookies (`token`, `refresh_token`); API clients may also use the `Authorization` header
    - **Header Auth**: Authorization header tokens are accepted for API clients
    - **Rate Limiting**: Applied to auth and payment endpoints
    - **CSRF**: State-changing requests require `X-CSRF-Token` except auth bootstrap endpoints
    - **Response Format**: JSON
    - **Version**: 1.0.0

    ## Domain Routes
    - **Authentication** (`/auth`) - Registration, login, token management, password reset, and session helpers
    - **Identity** (`/identity`) - User profiles, addresses, saved cards, employees, and onboarding
    - **Catalog** (`/catalog`) - Products and categories
    - **Wishlist** (`/wishlist`) - Authenticated user wishlist operations
    - **Ordering** (`/ordering`) - Cart, orders, authenticated checkout, and shipping
    - **Guest Commerce** (`/guest/cart`, `/checkout/guest`) - Guest cart and guest checkout flows
    - **Payments** (`/payments`) - Payment initialization, verification, refunds, and webhooks
    - **Admin API** (`/admin`) - Administrative API endpoints under `/api/v1/admin`
    - **Vendors** (`/vendors`) - Vendor applications and vendor self-service endpoints

    ## Admin Control Surfaces
    - **Route-based admin (CSR)**: `/admin`
    - **Subdomain admin (SSR)**: `http://admin.localhost:5000`
    - Adjust server URLs per environment when deploying outside local development.

  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
servers:
  - url: "http://localhost:5000"
    description: "Public application gateway"
  - url: "http://admin.localhost:5000"
    description: "Admin subdomain"
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: "Health check endpoint"
      description: "Returns basic health status of the API"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "API is healthy"

  /health/detailed:
    get:
      operationId: detailedHealthCheck
      summary: "Detailed health check"
      description: "Returns detailed health status including database and cache"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "Detailed health status"

  /health/ready:
    get:
      operationId: readinessCheck
      summary: "Readiness probe"
      description: "Kubernetes readiness probe endpoint"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "Service is ready"

  /health/live:
    get:
      operationId: livenessCheck
      summary: "Liveness probe"
      description: "Kubernetes liveness probe endpoint"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "Service is alive"

  /metrics:
    get:
      operationId: getMetrics
      summary: "Application metrics"
      description: "Returns Prometheus-compatible application metrics"
      tags: ["Monitoring"]
      security: []
      responses:
        "200":
          description: "Metrics in Prometheus format"

  /api/v1/auth/register:
    post:
      security: []
      operationId: registerUser
      summary: "Register a new user"
      description: "Create a new user account with email and password"
      tags: ["Authentication"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "User registered successfully"
        "400":
          description: "Validation error"
        "409":
          description: "Email already registered"

  /api/v1/auth/login:
    post:
      security: []
      operationId: loginUser
      summary: "Authenticate a user"
      description: "Login with email and password. Sets httpOnly auth cookies and returns user payload."
      tags: ["Authentication"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Login successful"
        "401":
          description: "Invalid credentials"

  /api/v1/auth/refresh-token:
    post:
      security: []
      operationId: refreshToken
      summary: "Refresh access token"
      description: "Rotates refresh token from httpOnly cookie and sets a new access token cookie."
      tags: ["Authentication"]
      responses:
        "200":
          description: "Token refreshed successfully"
        "401":
          description: "Invalid or expired refresh token"

  /api/v1/auth/csrf-token:
    get:
      security: []
      operationId: getCsrfToken
      summary: "Get CSRF token"
      description: "Returns CSRF token for subsequent state-changing requests via `X-CSRF-Token` header."
      tags: ["Authentication"]
      responses:
        "200":
          description: "CSRF token generated"
        "500":
          description: "Failed to generate CSRF token"

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: "Logout user"
      description: "Logout the current user and invalidate session"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Logout successful"
        "401":
          description: "Unauthorized"

  /api/v1/auth/verify-email:
    get:
      security: []
      operationId: verifyEmail
      summary: "Verify email address"
      description: "Verify user's email using token sent in registration email"
      tags: ["Authentication"]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Email verified successfully"
        "400":
          description: "Invalid or expired token"

  /api/v1/auth/forgot-password:
    post:
      security: []
      operationId: forgotPassword
      summary: "Request password reset"
      description: "Send password reset link to user's email"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Password reset email sent if account exists"

  /api/v1/auth/reset-password:
    post:
      security: []
      operationId: resetPassword
      summary: "Reset password"
      description: "Reset password using token from reset email"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Password reset successfully"
        "400":
          description: "Invalid or expired token"

  /api/v1/auth/resend-verification:
    post:
      operationId: resendEmailVerification
      summary: "Resend verification email"
      description: "Request a new verification email"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Verification email sent"
        "401":
          description: "Unauthorized"

  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      summary: "Change user password"
      description: "Change password with current password verification"
      tags: ["Authentication"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Password changed successfully"
        "401":
          description: "Current password is incorrect"

  /api/v1/auth/sessions:
    get:
      operationId: getActiveSessions
      summary: "Get active sessions"
      description: "List all active sessions for the current user"
      tags: ["Authentication"]
      responses:
        "200":
          description: "List of active sessions"
        "401":
          description: "Unauthorized"

  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: "Logout from all sessions"
      description: "Logout from all active sessions"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Logged out from all sessions"
        "401":
          description: "Unauthorized"

  /api/v1/auth/advanced/resend-verification:
    post:
      operationId: resendEmailVerificationAdvanced
      summary: "Resend verification email"
      description: "Compatibility auth endpoint for requesting a new verification email"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Verification email sent"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile:
    get:
      operationId: getProfile
      summary: "Get user profile"
      description: "Retrieve authenticated user's profile information"
      tags: ["Identity"]
      responses:
        "200":
          description: "Profile retrieved successfully"
        "401":
          description: "Unauthorized"
    patch:
      operationId: updateProfile
      summary: "Update user profile"
      description: "Update user's profile information"
      tags: ["Identity"]
      responses:
        "200":
          description: "Profile updated successfully"
        "401":
          description: "Unauthorized"
    delete:
      operationId: deleteAccount
      summary: "Delete user account"
      description: "Permanently delete user account"
      tags: ["Identity"]
      responses:
        "200":
          description: "Account deleted successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/password:
    patch:
      operationId: changeProfilePasswordPatch
      summary: "Change user password"
      description: "Change password with current password verification"
      tags: ["Identity"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Password changed successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/addresses:
    get:
      operationId: getAddresses
      summary: "Get all user addresses"
      description: "Retrieve all addresses for authenticated user"
      tags: ["Identity"]
      responses:
        "200":
          description: "Addresses retrieved successfully"
        "401":
          description: "Unauthorized"
    post:
      operationId: addAddress
      summary: "Add new address"
      description: "Add a new shipping or billing address"
      tags: ["Identity"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: "Address added successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/addresses/{addressId}:
    patch:
      operationId: updateAddress
      summary: "Update address"
      description: "Update an existing address"
      tags: ["Identity"]
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: "Address updated successfully"
        "401":
          description: "Unauthorized"
    put:
      operationId: replaceAddress
      summary: "Replace address"
      description: "Replace an existing address using the legacy PUT alias"
      tags: ["Identity"]
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: "Address updated successfully"
        "401":
          description: "Unauthorized"
    delete:
      operationId: deleteAddress
      summary: "Delete address"
      description: "Delete an address"
      tags: ["Identity"]
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Address deleted successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/cards:
    get:
      operationId: getSavedCards
      summary: "Get all saved cards"
      description: "Retrieve all saved payment cards"
      tags: ["Identity"]
      responses:
        "200":
          description: "Saved cards retrieved successfully"
        "401":
          description: "Unauthorized"
    post:
      operationId: addSavedCard
      summary: "Add saved card"
      description: "Save a new payment card for future use"
      tags: ["Identity"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedCardCreateRequest"
      responses:
        "201":
          description: "Card saved successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/cards/{cardId}:
    patch:
      operationId: updateSavedCard
      summary: "Update saved card preferences"
      description: "Update saved card preferences such as setting the card as primary"
      tags: ["Identity"]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedCardPrimaryRequest"
      responses:
        "200":
          description: "Card updated successfully"
        "401":
          description: "Unauthorized"
    delete:
      operationId: deleteSavedCard
      summary: "Delete saved card"
      description: "Delete a saved payment card"
      tags: ["Identity"]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Card deleted successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/cards/{cardId}/primary:
    put:
      operationId: setPrimaryCard
      summary: "Set primary card"
      description: "Set a card as the primary payment method"
      tags: ["Identity"]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedCardPrimaryRequest"
      responses:
        "200":
          description: "Primary card updated successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/employees/accept-invitation:
    get:
      security: []
      operationId: getEmployeeInvitationPreview
      summary: "Preview employee invitation"
      description: "Validate an invitation token and return invitation details before acceptance"
      tags: ["Identity"]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:

openapi: "3.0.0"
info:
  title: "E-Commerce API"
  version: "1.0.0"
  description: "API documentation for the E-Commerce application"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
servers:
  - url: "http://localhost:5000"
    description: "Development"
  - url: "https://staging.ecommerce.example/api"
    description: "Staging"
  - url: "https://api.ecommerce.example"
    description: "Production"
security:
  - bearerAuth: []
paths:
  /api/v1/users/register:
    post:
      security: []
      operationId: registerUser
      summary: "Register a new user"
      tags: ["Authentication"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "User registered successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Email already registered"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/login:
    post:
      security: []
      operationId: loginUser
      summary: "Authenticate a user"
      tags: ["Authentication"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Login successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users:
    get:
      operationId: listUsers
      summary: "Get all users"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "A list of users"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createUser
      summary: "Create a new user"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: "User created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Email already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{userId}:
    get:
      operationId: getUserById
      summary: "Get a user by ID"
      description: "Retrieve a specific user by their identifier"
      security:
        - bearerAuth: []
      parameters:
        - name: "userId"
          in: path
          description: "ID of the user to retrieve"
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: "User found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "Invalid user ID supplied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      operationId: replaceUser
      summary: "Update an existing user"
      description: "Replace an existing user's information"
      security:
        - bearerAuth: []
      parameters:
        - name: "userId"
          in: path
          description: "ID of the user to update"
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: "User updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateUserPartial
      summary: "Partially update an existing user"
      description: "Update specific fields of an existing user"
      security:
        - bearerAuth: []
      parameters:
        - name: "userId"
          in: path
          description: "ID of the user to update"
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: "User updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Invalid input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteUser
      summary: "Delete a specific user"
      description: "Remove a user from the system"
      security:
        - bearerAuth: []
      parameters:
        - name: "userId"
          in: path
          description: "ID of the user to delete"
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "204":
          description: "User deleted successfully"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/products:
    get:
      operationId: listProducts
      summary: "Get all products"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: "A list of products"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProduct
      summary: "Create a new product"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: "Product created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/products/{productId}:
    get:
      operationId: getProductById
      summary: "Get a product by ID"
      description: "Retrieve a specific product by its identifier"
      security:
        - bearerAuth: []
      parameters:
        - name: "productId"
          in: path
          description: "ID of the product to retrieve"
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: "Product found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: "Product not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "Invalid product ID supplied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: replaceProduct
      summary: "Update an existing product"
      description: "Replace an existing product's information"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          description: "ID of the product to update"
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: "Product updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Product not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProductPartial
      summary: "Partially update an existing product"
      description: "Update specific fields of an existing product"
      security:
        - bearerAuth: []
      parameters:
        - name: "productId"
          in: path
          description: "ID of the product to update"
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: "Product updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: "Invalid input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Product not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteProduct
      summary: "Delete a specific product"
      description: "Remove a product from the system"
      security:
        - bearerAuth: []
      parameters:
        - name: "productId"
          in: path
          description: "ID of the product to delete"
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "204":
          description: "Product deleted successfully"
        "404":
          description: "Product not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/cart:
    get:
      operationId: getCart
      summary: "Get current user's cart"
      description: "Retrieve the authenticated user's shopping cart with all items"
      tags: ["Cart"]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Cart retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/cart/items:
    post:
      operationId: addToCart
      summary: "Add item to cart"
      description: "Add a product variant to the user's cart"
      tags: ["Cart"]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
      responses:
        "201":
          description: "Item added to cart successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      summary: "Update cart item quantity"
      description: "Update the quantity of a specific item in the cart"
      tags: ["Cart"]
      security:
        - bearerAuth: []
      parameters:
        - name: "itemId"
          in: path
          description: "ID of the cart item to update"
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: "Cart item updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Cart item not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeFromCart
      summary: "Remove item from cart"
      description: "Remove a specific item from the cart"
      tags: ["Cart"]
      security:
        - bearerAuth: []
      parameters:
        - name: "itemId"
          in: path
          description: "ID of the cart item to remove"
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: "Cart item removed successfully"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cart item removed successfully"
        "404":
          description: "Cart item not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders:
    get:
      operationId: listOrders
      summary: "Get all orders"
      description: "Retrieve all orders (admin only or user's own orders)"
      tags: ["Orders"]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "A list of orders"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/orders/{orderId}:
    get:
      operationId: getOrderById
      summary: "Get order by ID"
      description: "Retrieve a specific order by its identifier"
      tags: ["Orders"]
      security:
        - bearerAuth: []
      parameters:
        - name: "orderId"
          in: path
          description: "ID of the order to retrieve"
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: "Order found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: "Order not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Field to sort by
      schema:
        type: string
        example: created_at
    Order:
      name: order
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: desc
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: "securePassword123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "securePassword123"
      example:
        email: "demo@example.com"
        password: "hunter2!!"

    UserCreateRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          minLength: 6
          maxLength: 100
          example: "securePassword123"
        first_name:
          type: string
          example: "Ada"
        last_name:
          type: string
          example: "Lovelace"
        role:
          type: string
          enum: [customer, admin, vendor]
          default: customer
          example: "customer"
      example:
        email: "new.user@example.com"
        password: "StrongPass!234"
        first_name: "Ada"
        last_name: "Lovelace"

    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 100
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [customer, admin, vendor]

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        first_name:
          type: string
          example: "Ada"
        last_name:
          type: string
          example: "Lovelace"
        role:
          type: string
          enum: [customer, admin, vendor]
          example: "customer"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
        token:
          type: string
          description: "JWT authentication token (only returned on register/login)"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ProductRequest:
      type: object
      required:
        - name
        - brand
        - base_price
      properties:
        name:
          type: string
          example: "Silk Chiffon Gown"
        description:
          type: string
          example: "Hand-beaded evening dress"
        brand:
          type: string
          example: "Elie Saab"
        material:
          type: string
          example: "100% silk chiffon"
        care_instructions:
          type: string
          example: "Dry clean only"
        base_price:
          type: number
          format: double
          example: 2895.00
        is_active:
          type: boolean
          default: true
      example:
        name: "Silk Chiffon Gown"
        description: "Hand-beaded evening dress"
        brand: "Elie Saab"
        material: "100% silk chiffon"
        care_instructions: "Dry clean only"
        base_price: 2895.00
        is_active: true

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: "Silk Chiffon Gown"
        description:
          type: string
        brand:
          type: string
        material:
          type: string
        care_instructions:
          type: string
        base_price:
          type: number
          format: double
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 1
        pageSize:
          type: integer
          format: int32
          example: 20
        total:
          type: integer
          format: int32
          example: 100
        hasNext:
          type: boolean
          example: true

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        pagination:
          $ref: "#/components/schemas/Pagination"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid product ID supplied"
        message:
          type: string
          example: "Email and password required."
      example:
        error: "Product not found"

    AddToCartRequest:
      type: object
      required:
        - variant_id
        - quantity
      properties:
        variant_id:
          type: integer
          format: int32
          example: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2

    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 3

    CartItemResponse:
      type: object
      properties:
        cart_item_id:
          type: integer
          format: int32
        cart_id:
          type: integer
          format: int32
        variant_id:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        added_at:
          type: string
          format: date-time

    CartItemDetail:
      type: object
      properties:
        cart_item_id:
          type: integer
          format: int32
        variant_id:
          type: integer
          format: int32
        quantity:
          type: integer
          format: int32
        added_at:
          type: string
          format: date-time
        sku:
          type: string
          example: "SKU-12345"
        size:
          type: string
          example: "M"
        color:
          type: string
          example: "Blue"
        price_adjustment:
          type: number
          format: double
          example: 0.00
        product_id:
          type: integer
          format: int32
        name:
          type: string
          example: "Silk Chiffon Gown"
        base_price:
          type: number
          format: double
          example: 2895.00
        brand:
          type: string
          example: "Elie Saab"

    CartResponse:
      type: object
      properties:
        cart_id:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemDetail"

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        user_id:
          type: integer
          format: int32
        net_amount:
          type: number
          format: double
        tax:
          type: number
          format: double
        shipping_cost:
          type: number
          format: double
        total_amount:
          type: number
          format: double
        status:
          type: string
          enum: [pending, paid, shipped, delivered, returned]
        created_at:
          type: string
          format: date-time

openapi: "3.0.0"
info:
  title: "E-Commerce Platform API"
  version: "1.0.0"
  description: |
    # E-Commerce REST API Documentation
    
    Modern full-stack e-commerce API with Domain-Driven Design architecture.
    
    ## API Overview
    - **Base URL**: `/api/v1`
    - **Authentication**: Bearer token (JWT)
    - **Rate Limiting**: Applied to auth and payment endpoints
    - **Response Format**: JSON
    
    ## Domain Routes
    - **Authentication** (`/auth`) - User registration, login, token management
    - **Identity** (`/identity`) - User profiles, addresses, payment methods
    - **Catalog** (`/catalog`) - Products, categories, wishlist
    - **Ordering** (`/ordering`) - Cart, orders, checkout, payments, shipping
    - **Vendors** (`/vendors`) - Vendor management and applications
    
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
servers:
  - url: "http://localhost:5000"
    description: "Development"
  - url: "https://staging.ecommerce.example"
    description: "Staging"
  - url: "https://api.ecommerce.example"
    description: "Production"
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: "Health check endpoint"
      description: "Returns basic health status of the API"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "API is healthy"

  /health/detailed:
    get:
      operationId: detailedHealthCheck
      summary: "Detailed health check"
      description: "Returns detailed health status including database and cache"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "Detailed health status"

  /health/ready:
    get:
      operationId: readinessCheck
      summary: "Readiness probe"
      description: "Kubernetes readiness probe endpoint"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "Service is ready"

  /health/live:
    get:
      operationId: livenessCheck
      summary: "Liveness probe"
      description: "Kubernetes liveness probe endpoint"
      tags: ["Health"]
      security: []
      responses:
        "200":
          description: "Service is alive"

  /metrics:
    get:
      operationId: getMetrics
      summary: "Application metrics"
      description: "Returns Prometheus-compatible application metrics"
      tags: ["Monitoring"]
      security: []
      responses:
        "200":
          description: "Metrics in Prometheus format"

  /api/v1/auth/register:
    post:
      security: []
      operationId: registerUser
      summary: "Register a new user"
      description: "Create a new user account with email and password"
      tags: ["Authentication"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "User registered successfully"
        "400":
          description: "Validation error"
        "409":
          description: "Email already registered"

  /api/v1/auth/login:
    post:
      security: []
      operationId: loginUser
      summary: "Authenticate a user"
      description: "Login with email and password. Returns JWT access token and refresh token."
      tags: ["Authentication"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Login successful"
        "401":
          description: "Invalid credentials"

  /api/v1/auth/refresh-token:
    post:
      security: []
      operationId: refreshToken
      summary: "Refresh access token"
      description: "Get a new access token using the refresh token"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Token refreshed successfully"
        "401":
          description: "Invalid or expired refresh token"

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: "Logout user"
      description: "Logout the current user and invalidate session"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Logout successful"
        "401":
          description: "Unauthorized"

  /api/v1/auth/verify-email:
    get:
      security: []
      operationId: verifyEmail
      summary: "Verify email address"
      description: "Verify user's email using token sent in registration email"
      tags: ["Authentication"]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Email verified successfully"
        "400":
          description: "Invalid or expired token"

  /api/v1/auth/forgot-password:
    post:
      security: []
      operationId: forgotPassword
      summary: "Request password reset"
      description: "Send password reset link to user's email"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Password reset email sent if account exists"

  /api/v1/auth/reset-password:
    post:
      security: []
      operationId: resetPassword
      summary: "Reset password"
      description: "Reset password using token from reset email"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Password reset successfully"
        "400":
          description: "Invalid or expired token"

  /api/v1/auth/resend-verification:
    post:
      operationId: resendEmailVerification
      summary: "Resend verification email"
      description: "Request a new verification email"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Verification email sent"
        "401":
          description: "Unauthorized"

  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      summary: "Change user password"
      description: "Change password with current password verification"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Password changed successfully"
        "401":
          description: "Current password is incorrect"

  /api/v1/auth/sessions:
    get:
      operationId: getActiveSessions
      summary: "Get active sessions"
      description: "List all active sessions for the current user"
      tags: ["Authentication"]
      responses:
        "200":
          description: "List of active sessions"
        "401":
          description: "Unauthorized"

  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: "Logout from all sessions"
      description: "Logout from all active sessions"
      tags: ["Authentication"]
      responses:
        "200":
          description: "Logged out from all sessions"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile:
    get:
      operationId: getProfile
      summary: "Get user profile"
      description: "Retrieve authenticated user's profile information"
      tags: ["Identity"]
      responses:
        "200":
          description: "Profile retrieved successfully"
        "401":
          description: "Unauthorized"
    put:
      operationId: updateProfile
      summary: "Update user profile"
      description: "Update user's profile information"
      tags: ["Identity"]
      responses:
        "200":
          description: "Profile updated successfully"
        "401":
          description: "Unauthorized"
    delete:
      operationId: deleteAccount
      summary: "Delete user account"
      description: "Permanently delete user account"
      tags: ["Identity"]
      responses:
        "200":
          description: "Account deleted successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/addresses:
    get:
      operationId: getAddresses
      summary: "Get all user addresses"
      description: "Retrieve all addresses for authenticated user"
      tags: ["Identity"]
      responses:
        "200":
          description: "Addresses retrieved successfully"
        "401":
          description: "Unauthorized"
    post:
      operationId: addAddress
      summary: "Add new address"
      description: "Add a new shipping or billing address"
      tags: ["Identity"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: "Address added successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/addresses/{addressId}:
    patch:
      operationId: updateAddress
      summary: "Update address"
      description: "Update an existing address"
      tags: ["Identity"]
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: "Address updated successfully"
        "401":
          description: "Unauthorized"
    delete:
      operationId: deleteAddress
      summary: "Delete address"
      description: "Delete an address"
      tags: ["Identity"]
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Address deleted successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/cards:
    get:
      operationId: getSavedCards
      summary: "Get all saved cards"
      description: "Retrieve all saved payment cards"
      tags: ["Identity"]
      responses:
        "200":
          description: "Saved cards retrieved successfully"
        "401":
          description: "Unauthorized"
    post:
      operationId: addSavedCard
      summary: "Add saved card"
      description: "Save a new payment card for future use"
      tags: ["Identity"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: "Card saved successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/cards/{cardId}:
    delete:
      operationId: deleteSavedCard
      summary: "Delete saved card"
      description: "Delete a saved payment card"
      tags: ["Identity"]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Card deleted successfully"
        "401":
          description: "Unauthorized"

  /api/v1/identity/profile/cards/{cardId}/primary:
    patch:
      operationId: setPrimaryCard
      summary: "Set primary card"
      description: "Set a card as the primary payment method"
      tags: ["Identity"]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Primary card updated successfully"
        "401":
          description: "Unauthorized"

  /api/v1/catalog/products:
    get:
      operationId: listProducts
      summary: "Get all products"
      description: "Retrieve all products with pagination"
      tags: ["Catalog"]
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "A list of products"
    post:
      operationId: createProduct
      summary: "Create a new product"
      description: "Create a new product (admin only)"
      tags: ["Catalog"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: "Product created successfully"
        "403":
          description: "Admin access required"

  /api/v1/catalog/products/{productId}:
    get:
      operationId: getProductById
      summary: "Get a product by ID"
      description: "Retrieve a specific product"
      tags: ["Catalog"]
      security: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Product found"
        "404":
          description: "Product not found"
    patch:
      operationId: updateProduct
      summary: "Update a product"
      description: "Update specific fields of a product (admin only)"
      tags: ["Catalog"]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Product updated successfully"
        "403":
          description: "Admin access required"
    delete:
      operationId: deleteProduct
      summary: "Delete a product"
      description: "Remove a product from the system (admin only)"
      tags: ["Catalog"]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Product deleted successfully"
        "403":
          description: "Admin access required"

  /api/v1/catalog/products/featured:
    get:
      operationId: getFeaturedProducts
      summary: "Get featured products"
      description: "Retrieve a list of featured/promoted products"
      tags: ["Catalog"]
      security: []
      responses:
        "200":
          description: "List of featured products"

  /api/v1/catalog/products/categories:
    get:
      operationId: getProductCategories
      summary: "Get product categories"
      description: "Retrieve all available product categories"
      tags: ["Catalog"]
      security: []
      responses:
        "200":
          description: "List of categories"

  /api/v1/catalog/wishlist:
    get:
      operationId: getWishlist
      summary: "Get user's wishlist"
      description: "Retrieve all products in the user's wishlist"
      tags: ["Catalog"]
      responses:
        "200":
          description: "Wishlist retrieved successfully"
        "401":
          description: "Unauthorized"
    post:
      operationId: addToWishlist
      summary: "Add product to wishlist"
      description: "Add a product to the user's wishlist"
      tags: ["Catalog"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: "Product added to wishlist"
        "401":
          description: "Unauthorized"
    delete:
      operationId: clearWishlist
      summary: "Clear entire wishlist"
      description: "Remove all products from the user's wishlist"
      tags: ["Catalog"]
      responses:
        "200":
          description: "Wishlist cleared successfully"
        "401":
          description: "Unauthorized"

  /api/v1/catalog/wishlist/{productId}:
    delete:
      operationId: removeFromWishlist
      summary: "Remove product from wishlist"
      description: "Remove a specific product from the user's wishlist"
      tags: ["Catalog"]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Product removed from wishlist"
        "401":
          description: "Unauthorized"

  /api/v1/catalog/wishlist/check/{productId}:
    get:
      operationId: checkInWishlist
      summary: "Check if product is in wishlist"
      description: "Check whether a specific product is in the user's wishlist"
      tags: ["Catalog"]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Wishlist status retrieved"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/cart:
    get:
      operationId: getCart
      summary: "Get current user's cart"
      description: "Retrieve the authenticated user's shopping cart"
      tags: ["Ordering"]
      responses:
        "200":
          description: "Cart retrieved successfully"
        "401":
          description: "Unauthorized"
    delete:
      operationId: clearCart
      summary: "Clear entire cart"
      description: "Remove all items from the user's cart"
      tags: ["Ordering"]
      responses:
        "200":
          description: "Cart cleared successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/cart/count:
    get:
      operationId: getCartCount
      summary: "Get total quantity of items in cart"
      description: "Returns the sum of quantities for the user's cart"
      tags: ["Ordering"]
      responses:
        "200":
          description: "Cart count retrieved successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/cart/items:
    post:
      operationId: addToCart
      summary: "Add item to cart"
      description: "Add a product variant to the user's cart"
      tags: ["Ordering"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: "Item added to cart successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      summary: "Update cart item quantity"
      description: "Update the quantity of a specific item in the cart"
      tags: ["Ordering"]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Cart item updated successfully"
        "401":
          description: "Unauthorized"
    delete:
      operationId: removeFromCart
      summary: "Remove item from cart"
      description: "Remove a specific item from the cart"
      tags: ["Ordering"]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Cart item removed successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/orders:
    get:
      operationId: listOrders
      summary: "Get all orders"
      description: "Retrieve orders for authenticated user"
      tags: ["Ordering"]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "A list of orders"
        "401":
          description: "Unauthorized"
    post:
      operationId: createOrder
      summary: "Create a new order"
      description: "Create a new order from the user's cart"
      tags: ["Ordering"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: "Order created successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/orders/{orderId}:
    get:
      operationId: getOrderById
      summary: "Get order by ID"
      description: "Retrieve a specific order"
      tags: ["Ordering"]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Order found"
        "404":
          description: "Order not found"
        "401":
          description: "Unauthorized"
    delete:
      operationId: cancelOrder
      summary: "Cancel order"
      description: "Cancel a pending order"
      tags: ["Ordering"]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Order cancelled successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      summary: "Update order status"
      description: "Update the status of an existing order (admin only)"
      tags: ["Ordering"]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Order status updated successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/payments:
    get:
      operationId: listUserPayments
      summary: "List user payments"
      description: "Get all payments for the authenticated user"
      tags: ["Ordering"]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "List of payments"
        "401":
          description: "Unauthorized"
    post:
      operationId: createPayment
      summary: "Initialize a payment"
      description: "Initialize a payment transaction"
      tags: ["Ordering"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: "Payment initialized successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/payments/{paymentId}:
    get:
      operationId: getPaymentById
      summary: "Get payment details"
      description: "Retrieve details of a specific payment"
      tags: ["Ordering"]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Payment details"
        "404":
          description: "Payment not found"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/payments/verify/{reference}:
    get:
      operationId: verifyPayment
      summary: "Verify payment status"
      description: "Verify a payment transaction"
      tags: ["Ordering"]
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Payment verified successfully"
        "401":
          description: "Unauthorized"

  /api/v1/ordering/payments/callback:
    get:
      operationId: paymentCallback
      summary: "Payment callback"
      description: "Handle payment processor callback"
      tags: ["Ordering"]
      security: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: "Redirect to success or failure page"

  /api/v1/ordering/payments/webhook:
    post:
      operationId: paymentWebhook
      summary: "Payment webhook"
      description: "Handle payment processor webhook events"
      tags: ["Ordering"]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Webhook processed successfully"

  /api/v1/ordering/shipping/rates:
    post:
      operationId: calculateShippingRates
      summary: "Calculate shipping rates"
      description: "Calculate available shipping rates for a destination"
      tags: ["Ordering"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Shipping rates calculated successfully"
        "401":
          description: "Unauthorized"

  /api/v1/vendors/apply:
    post:
      operationId: applyAsVendor
      summary: "Apply as vendor"
      description: "Submit vendor application"
      tags: ["Vendors"]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: "Application submitted successfully"

  /api/v1/vendors/applications:
    get:
      operationId: getVendorApplications
      summary: "Get vendor applications"
      description: "Retrieve vendor applications (admin only)"
      tags: ["Vendors"]
      responses:
        "200":
          description: "List of applications"
        "403":
          description: "Forbidden"

  /api/v1/vendors/applications/{applicationId}/approve:
    post:
      operationId: approveVendorApplication
      summary: "Approve vendor application"
      description: "Approve a vendor application (admin only)"
      tags: ["Vendors"]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Application approved"
        "403":
          description: "Forbidden"

  /api/v1/vendors/me:
    get:
      operationId: getVendorProfile
      summary: "Get current vendor profile"
      description: "Retrieve authenticated vendor's profile"
      tags: ["Vendors"]
      responses:
        "200":
          description: "Vendor profile"
        "404":
          description: "Vendor not found"
    patch:
      operationId: updateVendorProfile
      summary: "Update vendor profile"
      description: "Update authenticated vendor's profile"
      tags: ["Vendors"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Profile updated"
        "404":
          description: "Vendor not found"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-based)
      schema:
        type: integer
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        default: 20
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AddressInput:
      type: object
      required:
        - type
        - street
        - city
        - country
      properties:
        type:
          type: string
          enum: ["shipping", "billing"]
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postalCode:
          type: string

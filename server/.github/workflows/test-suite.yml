name: 🧪 Production-Grade Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: fullstack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: server

      - name: Setup Test Database
        run: |
          chmod +x scripts/setup-test-db.sh
          ./scripts/setup-test-db.sh
        working-directory: server
        env:
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432
          DB_NAME_TEST: fullstack_test
          DB_USER_TEST: postgres
          DB_PASSWORD_TEST: postgres
          PGPASSWORD: postgres

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage --runInBand
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432
          DB_NAME_TEST: fullstack_test
          DB_USER_TEST: postgres
          DB_PASSWORD_TEST: postgres

      - name: Run Integration Tests
        run: npm run test:integration -- --coverage --runInBand
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432
          DB_NAME_TEST: fullstack_test
          DB_USER_TEST: postgres
          DB_PASSWORD_TEST: postgres

      - name: Run E2E Tests
        run: npm run test:e2e -- --coverage --runInBand
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432
          DB_NAME_TEST: fullstack_test
          DB_USER_TEST: postgres
          DB_PASSWORD_TEST: postgres

      - name: Run Security Tests
        run: npm run test:security -- --coverage --runInBand
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST_TEST: localhost
          DB_PORT_TEST: 5432
          DB_NAME_TEST: fullstack_test
          DB_USER_TEST: postgres
          DB_PASSWORD_TEST: postgres

      - name: Check Coverage Thresholds
        run: npm run test:coverage
        working-directory: server

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./server/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true

      - name: Report Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: server/test-results/junit.xml
          reporter: java-junit

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./server/coverage/lcov.info

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: server

      - name: Lint Code
        run: npm run lint
        working-directory: server

      - name: Check Types
        run: npm run type-check
        working-directory: server

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Security Audit
        run: npm audit --audit-level=moderate
        working-directory: server
        continue-on-error: true

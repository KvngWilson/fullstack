x-server-env: &server-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 5000
  APP_NAME: ${APP_NAME:-fullstack-ecommerce}

  # Database Configuration
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-ecommerce_db}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  DB_POOL_MAX: ${DB_POOL_MAX:-100}
  DB_POOL_MIN: ${DB_POOL_MIN:-10}

  # Redis Configuration
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_1234567890}

  # Security
  JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
  SESSION_SECRET: ${SESSION_SECRET:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}

  # Application
  API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
  APP_URL: ${APP_URL:-http://localhost:5000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

  # Email Configuration (MailHog for development)
  EMAIL_HOST: ${EMAIL_HOST:-mailhog}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  EMAIL_SECURE: ${EMAIL_SECURE:-false}
  EMAIL_SERVICE: ${EMAIL_SERVICE:-mailhog}
  EMAIL_USER: ${EMAIL_USER:-dev@example.com}
  EMAIL_PASS: ${EMAIL_PASS:-}
  EMAIL_FROM: ${EMAIL_FROM:-E-Commerce Team <noreply@localhost>}

  # Payment Processors
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dev_mode}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dev_mode}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev_mode}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_dev_mode}
  PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-pk_test_dev_mode}

  # Shipping & Logistics
  EASYSHIP_API_KEY: ${EASYSHIP_API_KEY:-dev_mode_key}

x-server-healthcheck: &server-healthcheck
  test:
    [
      "CMD",
      "wget",
      "--quiet",
      "--tries=1",
      "--spider",
      "http://localhost:5000/health/live",
    ]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 40s

x-server-common: &server-common
  build:
    context: ./server
    dockerfile: Dockerfile
    args:
      NODE_ENV: ${NODE_ENV:-production}
  environment: *server-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  expose:
    - "5000"
  volumes:
    - ./server/logs:/app/logs
    - ./server/uploads:/app/uploads
  restart: unless-stopped
  networks:
    - fullstack-network
  healthcheck: *server-healthcheck

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fullstack-postgres
    labels:
      description: "PostgreSQL database for e-commerce application"
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/queries.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./server/infrastructure/database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - fullstack-network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: fullstack-redis
    labels:
      description: "Redis cache and session store"
    command: sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password_1234567890}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - fullstack-network

  # SMTP Email Service
  mailhog:
    image: tophfr/mailhog:latest
    container_name: fullstack-mailhog
    labels:
      description: "MailHog SMTP server for email testing"
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped
    networks:
      - fullstack-network

  # Node.js API Server (primary)
  server:
    <<: *server-common
    container_name: fullstack-server-1
    labels:
      description: "Node.js Express API server"
      version: "1.0.0"

  # Node.js API Server (replica)
  server-replica:
    <<: *server-common
    container_name: fullstack-server-2
    labels:
      description: "Node.js Express API server replica"
      version: "1.0.0"

  # NGINX reverse proxy and load balancer for backend APIs
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fullstack-gateway
    labels:
      description: "NGINX reverse proxy and load balancer"
    depends_on:
      server:
        condition: service_healthy
      server-replica:
        condition: service_healthy
    ports:
      - "5000:80"
    restart: unless-stopped
    networks:
      - fullstack-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # React Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_API_VERSION: ${VITE_API_VERSION:-v1}
        VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY:-pk_test_dev_mode}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:-}
        VITE_MAX_FILE_SIZE: ${VITE_MAX_FILE_SIZE:-5242880}
        VITE_ALLOWED_IMAGE_TYPES: ${VITE_ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
        VITE_ENABLE_WISHLIST: ${VITE_ENABLE_WISHLIST:-true}
        VITE_ENABLE_REVIEWS: ${VITE_ENABLE_REVIEWS:-true}
        VITE_ENABLE_VENDOR_REGISTRATION: ${VITE_ENABLE_VENDOR_REGISTRATION:-true}
        VITE_GA_TRACKING_ID: ${VITE_GA_TRACKING_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: fullstack-client
    labels:
      description: "React frontend application via Nginx"
      version: "1.0.0"
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5173}:80"
    volumes:
      # Mount dist folder for hot reload during development
      - ./client/dist:/usr/share/nginx/html:ro
      # Mount nginx logs for debugging
      - ./client/logs:/var/log/nginx:rw
    environment:
      # Pass API URL to nginx for potential runtime config
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    restart: unless-stopped
    networks:
      - fullstack-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ | grep -q '<html' && echo 'OK' || exit 1",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fullstack-network:
    driver: bridge

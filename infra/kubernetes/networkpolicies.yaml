---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dovecot-from-namespace
spec:
  podSelector:
    matchLabels:
      app: mailstack
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 143
        - protocol: TCP
          port: 993

apiVersion: v1
kind: ConfigMap
metadata:
  name: fullstack-config
data:
  NODE_ENV: production
  PORT: "5000"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ecommerce_db
  DB_USER: postgres
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  API_URL: https://ashbourne.dev
  FRONTEND_URL: https://ashbourne.dev
  ADMIN_URL: https://admin.ashbourne.dev
  ALLOWED_ORIGINS: https://ashbourne.dev,https://admin.ashbourne.dev
  LOG_LEVEL: info
  EMAIL_HOST: postfix
  EMAIL_PORT: "587"
  EMAIL_SECURE: "false"
  EMAIL_SERVICE: smtp
  EMAIL_USER: admin@ashbourne.dev
  EMAIL_FROM: Fullstack Store <no-reply@ashbourne.dev>
  MAIL_HOSTNAME: mail.ashbourne.dev
  DOMAIN_NAME: ashbourne.dev
  WWW_DOMAIN_NAME: www.ashbourne.dev
  ADMIN_DOMAIN: admin.ashbourne.dev
  GATEWAY_BACKEND_HOST: server
  GATEWAY_BACKEND_PORT: "5000"
  GATEWAY_FRONTEND_HOST: client
  GATEWAY_FRONTEND_PORT: "80"
  TLS_CERT_PATH: /etc/nginx/ssl/tls.crt
  TLS_KEY_PATH: /etc/nginx/ssl/tls.key
  ADMIN_TLS_CERT_PATH: /etc/nginx/ssl/tls.crt
  ADMIN_TLS_KEY_PATH: /etc/nginx/ssl/tls.key

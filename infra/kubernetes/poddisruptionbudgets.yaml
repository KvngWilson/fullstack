apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: server-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: client-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: client
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway

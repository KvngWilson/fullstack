apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-config
data:
  default.conf.template: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    upstream backend_upstream {
      least_conn;
      server ${GATEWAY_BACKEND_HOST}:${GATEWAY_BACKEND_PORT} max_fails=3 fail_timeout=10s weight=5;
      server ${GATEWAY_BACKEND_REPLICA_HOST}:${GATEWAY_BACKEND_PORT} max_fails=3 fail_timeout=10s;
      keepalive 32;
    }

    upstream frontend_upstream {
      server ${GATEWAY_FRONTEND_HOST}:${GATEWAY_FRONTEND_PORT} max_fails=3 fail_timeout=10s;
      keepalive 16;
    }

    server {
      listen 80;
      server_name ${DOMAIN_NAME} ${WWW_DOMAIN_NAME} localhost 127.0.0.1;

      location ~* ^/(api|health|metrics|api-docs|swagger|uploads|socket.io)/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
      }

      location / {
        return 301 https://$host$request_uri;
      }
    }

    server {
      listen 80;
      server_name ${ADMIN_DOMAIN} admin.localhost;

      location / {
        return 301 https://$host$request_uri;
      }
    }

    server {
      listen 443 ssl;
      server_name ${ADMIN_DOMAIN} admin.localhost;

      ssl_certificate /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384;

      client_max_body_size 10m;

      location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
      }
    }

    server {
      listen 443 ssl;
      server_name ${DOMAIN_NAME} ${WWW_DOMAIN_NAME} localhost 127.0.0.1;

      ssl_certificate /etc/nginx/ssl/tls.crt;
      ssl_certificate_key /etc/nginx/ssl/tls.key;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384;

      client_max_body_size 10m;

      location ~* ^/(api/v1|api-docs|health|metrics|uploads|socket.io)(/|$) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass_header Set-Cookie;
        proxy_pass_header Authorization;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
      }

      location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
      }
    }

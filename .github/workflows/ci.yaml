name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "server/**"
      - "Dockerfile"
      - "server/Dockerfile"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/ci.yaml"
  push:
    branches: [main, develop]
    paths:
      - "server/**"
      - "Dockerfile"
      - "server/Dockerfile"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/ci.yaml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fullstack_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d fullstack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./server

    env:
      CI: "true"
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: fullstack_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST_TEST: 127.0.0.1
      DB_PORT_TEST: "5432"
      DB_NAME_TEST: fullstack_test
      DB_USER_TEST: postgres
      DB_PASSWORD_TEST: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      JWT_SECRET: test_jwt_secret_at_least_32_characters_long
      SESSION_SECRET: test_session_secret_at_least_32_characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Prepare test database
        run: |
          chmod +x scripts/setup-test-db.sh
          ./scripts/setup-test-db.sh

      - name: Run backend coverage suite
        run: npm run test:coverage -- --runInBand

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker build (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: gateway
            context: .
            dockerfile: ./Dockerfile
            tag: fullstack-gateway
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile
            tag: fullstack-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: ${{ matrix.image.tag }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Frontend Performance

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "client/**"
      - ".github/workflows/performance.yml"
      - ".github/workflows/ci.yaml"
  push:
    branches: [main, develop]
    paths:
      - "client/**"
      - ".github/workflows/performance.yml"
      - ".github/workflows/ci.yaml"

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend quality and performance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./client

    env:
      CI: "true"
      CYPRESS_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint

      - name: Run client tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Enforce coverage policy
        run: npm run ci:coverage:policy

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Enforce bundle-size budget
        env:
          BUNDLE_SIZE_LIMIT_BYTES: "3145728"
        run: npm run ci:bundle

      - name: Start preview server
        run: |
          npm exec vite preview -- --host 127.0.0.1 --port 4173 > ../preview.log 2>&1 &
          echo $! > ../preview.pid

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Preview server failed to start"
          cat ../preview.log || true
          exit 1

      - name: Run critical Cypress regression
        run: npm run e2e:critical

      - name: Run accessibility gate
        run: npx @axe-core/cli http://127.0.0.1:4173 --exit

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: ./client/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

      - name: Stop preview server
        if: always()
        working-directory: .
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)"
            rm -f preview.pid
          fi

      - name: Upload frontend quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-artifacts
          path: |
            client/coverage
            client/dist
            client/lighthouse-results
            client/test-results
            preview.log
          if-no-files-found: ignore
          retention-days: 7

  client-docker-build:
    name: Docker build (client)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: fullstack-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

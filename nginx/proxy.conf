upstream backend_upstream {
  least_conn;
  server server:5000 max_fails=3 fail_timeout=10s weight=5;
  server server-replica:5000 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

upstream frontend_upstream {
  server client:80 max_fails=3 fail_timeout=10s;
  keepalive 16;
}

server {
  listen 80;
  server_name localhost;

  # API, health, docs, and uploads are served directly over HTTP
  # so the browser never hits the HTTPS cert wall for XHR/fetch calls.
  location ~* ^/(api|health|metrics|api-docs|swagger|uploads)/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_header Set-Cookie;
    proxy_pass_header Authorization;

    proxy_set_header   Connection "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
  }

  # All other browser traffic is redirected to HTTPS
  location / {
    return 301 https://$host:5443$request_uri;
  }
}

server {
  listen 80;
  server_name admin.localhost;
  return 301 https://admin.localhost:5443$request_uri;
}

# Admin SSR host routing: all requests on admin.* go to backend vhost.
server {
  listen 443 ssl;
  server_name admin.localhost;

  ssl_certificate /etc/nginx/ssl/localhost+1.pem;
  ssl_certificate_key /etc/nginx/ssl/localhost+1-key.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384;

  client_max_body_size 10m;

  location / {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_header Set-Cookie;
    proxy_pass_header Authorization;

    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
  }
}

server {
  listen 443 ssl;
  server_name localhost;

  ssl_certificate /etc/nginx/ssl/localhost.crt;
  ssl_certificate_key /etc/nginx/ssl/localhost.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384;

  client_max_body_size 10m;

  location ~* ^/(api/v1|api-docs|health|metrics|uploads)(/|$) {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_header Set-Cookie;
    proxy_pass_header Authorization;

    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
  }
}
